version: '3'
services:
  pig-ui:
    build:
      context: ./
    restart: always
    container_name: pig-ui
    image: pig-ui
    networks:
      - spring_cloud_default
    ports:
      - 30080:80

# 加入到后端网络， 默认为 ry-test  | docker network ls   查看
networks:
  spring_cloud_default:
    name:  spring_cloud_default
    driver: bridge
